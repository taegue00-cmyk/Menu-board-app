<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  ★★★ 사장님이 고치는 곳은 바로 아래 한 곳뿐이에요! ★★★        ║
  ║  가게 정보, 메뉴 이름, 가격, 설명이 전부 여기에 모여 있어요.   ║
  ║  이 파일의 다른 부분은 건드리지 않아도 돼요.                   ║
  ╚══════════════════════════════════════════════════════════════╝

  [고치는 순서 - 이것만 지키면 안전해요]
   1) 이 파일(index.html)을 메모장이나 VS Code로 열어요.
   2) 아래 "메뉴판 정보" 칸에서 고치고 싶은 글자만 바꿔요.
   3) 저장(Ctrl + S)하고, 브라우저에서 새로고침(F5)하면 바로 반영돼요.
   4) 화면이 이상해지면 방금 고친 줄을 되돌리세요. (아래 '자주 하는 실수' 참고)

  [꼭 지켜야 할 약속 - 따옴표와 쉼표]
   - 글자는 항상 큰따옴표 " " 로 감싸요.      예) "5,000원"
   - 따옴표는 키보드의 쌍따옴표 모양이어야 해요. (워드에서 복사한 ” “ 모양은 안 돼요)
   - 줄 끝의 쉼표(,)를 지우지 마세요.
     단, 한 묶음의 "맨 마지막 줄"에는 쉼표가 없어요. (아래 예시 참고)
   - // 로 시작하는 줄은 설명 글이라서 화면에 안 나와요. 마음대로 써도 돼요.
-->
<script>
  /* ================================================================
     1. 가게 정보 (맨 위 이름/소개, 맨 아래 영업시간/전화에 나와요)
     ================================================================
     - 따옴표 " " 안의 글자만 바꾸세요. 따옴표와 쉼표는 그대로 두세요.
     - 전화번호는 숫자와 - 만 쓰세요. (전화 걸기 버튼이 이 번호로 연결돼요)
  */
  var 가게 = {
    이름: "브릿지 커피",                       // 맨 위 큰 제목
    소개: "매일 직접 볶는 스페셜티 커피",        // 이름 아래 한 줄 소개
    위치: "광주 북구 비엔날레",                  // 가게 위치 (📍 표시가 자동으로 붙어요)
    평일: "평일 08:00 - 21:00",                 // 평일 영업시간
    주말: "주말 10:00 - 20:00",                 // 주말 영업시간
    휴무: "목요일 휴무",                         // 쉬는 날 (없으면 "연중무휴" 라고 쓰세요)
    전화: "062-000-0000",                       // ★ 실제 가게 전화번호로 바꿔주세요!
    추가안내: "주차 2대 가능 · 인스타 @bridge_coffee · 1인 좌석 6석"   // 맨 아래 안내 글
  };

  /* ================================================================
     2. 시그니처 메뉴 (이름 옆에 작은 배지가 붙고, 카드가 살짝 더 돋보이는 메뉴)
     ================================================================
     - 아래 메뉴 목록에 있는 이름과 "글자 하나까지 똑같이" 적어야 표시가 붙어요.
       (띄어쓰기도 똑같이! "흑임자 라떼" 와 "흑임자라떼" 는 다른 글자예요)
     - 시그니처 메뉴를 늘리려면: "아인슈페너", "흑임자 라떼", "새메뉴이름"  처럼 쉼표로 이어요.
     - 시그니처 표시를 없애려면: [] 처럼 대괄호 안을 비워요.
  */
  var 시그니처메뉴 = ["아인슈페너", "흑임자 라떼"];

  // 배지에 적히는 글자예요. 따옴표 안만 바꾸세요. 예) "시그니처", "인기 메뉴", "사장님 추천"
  var 시그니처글자 = "사장님 추천";

  /* ================================================================
     3. 메뉴 목록  ★ 가장 자주 고치는 곳이에요 ★
     ================================================================
     구조는 상자 안에 상자예요.

       "커피": [          ← 분류 이름(위쪽 버튼 글자가 돼요). 대괄호 [ 로 시작해요
         { 메뉴 하나 },   ← 메뉴 한 줄 = 메뉴 하나. 줄 끝에 쉼표
         { 메뉴 하나 }    ← 분류의 맨 마지막 메뉴는 쉼표를 붙이지 않아요
       ],                 ← 대괄호 ] 로 끝나요. 다음 분류가 있으면 쉼표

     메뉴 한 줄은 이렇게 생겼어요:
       { 이름: "아메리카노", 가격: "4,500원", 설명: "산미가 적은 고소한 원두", 품절: 0 },
            ↑ 메뉴 이름          ↑ 가격 (원 글자까지 직접 써요)   ↑ 한 줄 설명      ↑ 품절 켜고 끄기 (아래 (바) 참고)

     ------------------------------------------------------------
     (가) 가격을 고치고 싶을 때
         가격: "4,500원"  →  가격: "4,800원"
         따옴표 안의 숫자만 바꾸세요. 쉼표(,)와 "원"도 같이 직접 써요.

     (나) 메뉴 이름이나 설명을 고치고 싶을 때
         따옴표 안의 글자만 바꾸세요.
         ※ 시그니처 메뉴로 지정한 메뉴의 이름을 바꾸면, 위 "시그니처메뉴"에 적힌 이름도 똑같이 바꿔야 해요.

     (다) 메뉴를 새로 추가하고 싶을 때
         1. 같은 분류 안에서 아무 메뉴 한 줄을 통째로 복사해요.
         2. 원하는 위치에 붙여넣어요. (붙인 줄 위치 그대로 화면에 나와요)
         3. 이름 / 가격 / 설명 글자를 새 메뉴 내용으로 바꿔요.
         4. 쉼표 확인! 맨 마지막 줄만 쉼표가 없고, 나머지 줄은 모두 끝에 쉼표가 있어야 해요.
            (맨 끝에 추가했다면, 원래 마지막 줄 끝에 쉼표를 붙이고, 새 줄은 쉼표를 빼요)

     (라) 메뉴를 없애고 싶을 때
         그 메뉴 한 줄을 통째로 지워요. (맨 마지막 줄을 지웠다면 그 위 줄의 끝 쉼표도 지워요)
         잠깐 숨기고 싶을 땐 줄 맨 앞에 // 를 붙이면 화면에서만 사라져요. 다시 보이려면 // 를 지우면 돼요.
         예)  // { 이름: "스콘", 가격: "4,000원", 설명: "..." },

     (마) 분류(버튼)를 새로 만들고 싶을 때 (예: "빵")
         "디저트": [ ... ] 묶음 전체를 복사해서 아래에 붙이고,
         이름을 "빵" 으로 바꾼 뒤 안의 메뉴를 고쳐요.
         앞 묶음의 끝 ] 뒤에 쉼표를 붙이는 것도 잊지 마세요.
         분류 이름을 바꾸면 위쪽 버튼 글자도 같이 바뀌어요.

     (바) 품절로 표시하고 싶을 때  ★ 숫자 한 글자만 바꾸면 돼요 ★
         메뉴 줄 끝의 품절 숫자를 바꿔요.
           품절: 0  →  품절: 1     (0 = 판매 중, 1 = 오늘 품절)
         예) { 이름: "스콘", 가격: "4,000원", 설명: "...", 품절: 1 },
         - 1로 바꾸면 그 메뉴 카드가 흐려지고, 가격에 줄이 그어지고, '오늘 품절' 표시가 떠요.
         - 다시 판매하려면 1을 0으로 되돌리면 돼요.
         - 저장(Ctrl + S) 후 브라우저에서 새로고침(F5)하면 바로 반영돼요.
         - 새 메뉴를 추가할 때는 한 줄을 복사해서 붙이면 품절 칸도 같이 따라와요.
           (품절 칸을 지워도 괜찮아요. 칸이 없으면 판매 중으로 봐요.)

     ------------------------------------------------------------
     [자주 하는 실수]
       - 따옴표를 하나만 쓰거나 빼먹음  → 화면이 하얗게 비어요
       - 줄 끝 쉼표를 빼먹음            → 화면이 하얗게 비어요
       - 맨 마지막 줄에 쉼표를 붙임     → 대부분 괜찮지만, 이상하면 지워보세요
       - 메뉴 이름 안에 큰따옴표(") 사용 → 안 돼요. 필요하면 작은따옴표(')를 쓰세요
       화면이 하얗게 변하면 당황하지 말고, 방금 고친 줄의 따옴표와 쉼표를 확인하거나
       Ctrl + Z 로 되돌리세요.
  */
  var 메뉴 = {
    "커피": [
      { 이름: "아메리카노",         가격: "4,500원", 설명: "산미가 적은 고소한 원두", 품절: 0 },
      { 이름: "카페라떼",           가격: "5,000원", 설명: "부드러운 우유 거품", 품절: 0 },
      { 이름: "바닐라 라떼",        가격: "5,500원", 설명: "바닐라빈을 직접 우려낸 시럽", 품절: 0 },
      { 이름: "아인슈페너",         가격: "5,800원", 설명: "단맛을 줄인 수제 크림", 품절: 1 },
      { 이름: "콜드브루",           가격: "5,300원", 설명: "12시간 저온 추출, 목넘김이 깔끔함", 품절: 0 },
      { 이름: "디카페인 아메리카노", 가격: "5,000원", 설명: "카페인 걱정 없이 편하게", 품절: 0 }
    ],
    "논커피": [
      { 이름: "흑임자 라떼", 가격: "5,500원", 설명: "국산 흑임자를 직접 갈아 넣음", 품절: 0 },
      { 이름: "말차 라떼",   가격: "5,800원", 설명: "우지 말차, 쌉쌀한 맛이 진함", 품절: 0 },
      { 이름: "쑥 라떼",     가격: "5,500원", 설명: "강화도 쑥, 은은하고 담백함", 품절: 0 },
      { 이름: "곡물 라떼",   가격: "5,300원", 설명: "볶은 곡물의 구수한 맛", 품절: 0 },
      { 이름: "자몽에이드",  가격: "6,000원", 설명: "생과일 자몽 과육을 그대로", 품절: 0 }
    ],
    "디저트": [
      { 이름: "치즈케이크",       가격: "6,500원", 설명: "굽지 않은 부드러운 식감", 품절: 0 },
      { 이름: "당근케이크",       가격: "6,000원", 설명: "견과류를 넉넉히 넣음", 품절: 0 },
      { 이름: "스콘",             가격: "4,000원", 설명: "겉은 바삭 속은 촉촉, 잼과 함께", 품절: 0 },
      { 이름: "바스크 치즈케이크", 가격: "6,800원", 설명: "겉면을 진하게 태운 풍미", 품절: 0 }
    ]
  };
  /* ★ 여기까지가 사장님이 고치는 곳이에요. 이 아래부터는 건드리지 마세요. ★ */
</script>
<title>브릿지 커피 메뉴판</title>
<!-- 고운 돋움 글꼴을 인터넷에서 불러오는 줄이에요. (인터넷이 안 되면 맑은 고딕으로 보여요) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ===== 색상 (나중에 바꾸고 싶으면 여기 세 줄만 고치세요) ===== */
  :root {
    --옅은회색: #E8E8EA;   /* 배경 색 */
    --크림색: #F5EFE6;     /* 카드, 버튼 색 */
    --글자색: #3B3632;     /* 모든 글자 색 (짙은 회갈색) */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* 배경: 옅은 회색에서 크림색으로 은은하게 이어지는 그라데이션 */
  body {
    font-family: "고운 돋움", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
    color: var(--글자색);
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.9) 0%, transparent 40%),
      radial-gradient(circle at 90% 75%, rgba(245, 239, 230, 0.95) 0%, transparent 50%),
      linear-gradient(160deg, var(--옅은회색) 0%, var(--크림색) 100%);
    min-height: 100vh;
    line-height: 1.6;
    word-break: keep-all;            /* 한글 단어 중간에서 끊기지 않게 */
    overflow-wrap: break-word;       /* 너무 긴 글자는 줄바꿈해서 화면 밖으로 안 나가게 */
    -webkit-text-size-adjust: 100%;  /* 아이폰을 가로로 돌려도 글자가 저절로 커지지 않게 */
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .화면 {
    max-width: 430px; margin: 0 auto;
    padding: 32px 20px 120px;   /* 아래 120px: 떠 있는 전화 버튼에 내용이 가려지지 않게 비워둔 자리 */
    padding-left: max(20px, env(safe-area-inset-left));
    padding-right: max(20px, env(safe-area-inset-right));
  }

  /* 반투명 유리 카드 */
  .유리 {
    background: rgba(245, 239, 230, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    box-shadow: 0 10px 32px rgba(59, 54, 50, 0.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  /* 맨 위 */
  .머리 { text-align: center; padding: 40px 20px; margin-bottom: 28px; }
  .머리 h1 { font-size: 32px; letter-spacing: 1px; }
  .머리 .소개 { margin-top: 10px; font-size: 17px; }
  .머리 .위치 { margin-top: 8px; font-size: 15px; opacity: 0.7; }

  /* 분류 버튼 (누르기 편하게 크게) */
  /* 분류 버튼 줄: 스크롤해도 화면 위에 붙어서 따라와요. 분류가 많아지면 옆으로 밀어서 볼 수 있어요 */
  .탭줄 {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: 10px; margin: 0 -20px 12px; padding: 12px 20px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    background: rgba(232, 232, 234, 0.8);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .탭줄::-webkit-scrollbar { display: none; }
  .탭 {
    flex: 1 0 auto; min-width: 96px; padding: 0 18px; min-height: 52px; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-size: 17px; color: var(--글자색);
    background: rgba(245, 239, 230, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.8);
    box-shadow: 0 4px 14px rgba(59, 54, 50, 0.08);
  }
  .탭.선택됨 { background: var(--글자색); color: var(--크림색); font-weight: bold; }

  /* 메뉴 카드 */
  .메뉴카드 { padding: 22px 22px; margin-bottom: 16px; }
  .메뉴윗줄 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .메뉴이름 { font-size: 18px; font-weight: bold; flex: 1; min-width: 0; }
  .메뉴가격 { font-size: 20px; font-weight: bold; white-space: nowrap; }   /* 가격: 크고 진하게 */
  .메뉴설명 { margin-top: 6px; font-size: 15px; opacity: 0.75; }
  .시그니처표시 {
    display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: normal; vertical-align: middle; white-space: nowrap;
    background: var(--글자색); color: var(--크림색);
  }
  /* 시그니처 카드: 살짝 더 진하고, 테두리와 그림자가 더 도드라져요 */
  .메뉴카드.시그니처 {
    background: rgba(245, 239, 230, 0.85);
    border: 2px solid rgba(59, 54, 50, 0.45);
    box-shadow: 0 14px 36px rgba(59, 54, 50, 0.20);
  }
  /* 품절 카드: 흐리게, 가격에 줄, '오늘 품절' 표시 */
  .메뉴카드.품절 { opacity: 0.5; }
  .메뉴카드.품절 .메뉴가격 { text-decoration: line-through; }
  .품절표시 {
    display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px;
    font-size: 13px; font-weight: bold; vertical-align: middle; white-space: nowrap;
    background: #8a8580; color: #fff;
  }

  /* 맨 아래 */
  .아래 { padding: 30px 22px; margin-top: 32px; text-align: center; }
  .아래 h2 { font-size: 20px; margin-bottom: 14px; }
  .아래 p { font-size: 16px; margin-bottom: 6px; }
  /* 전화 버튼: 스크롤해도 화면 아래에 계속 떠 있어요 */
  .전화버튼 {
    position: fixed; z-index: 20;
    left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom));
    width: calc(100% - 40px); max-width: 390px;
    display: flex; align-items: center; justify-content: center;
    min-height: 56px; border-radius: 999px;
    background: var(--글자색); color: var(--크림색);
    font-size: 18px; font-weight: bold; text-decoration: none;
    box-shadow: 0 8px 20px rgba(59, 54, 50, 0.25);
  }

  /* 휴대폰을 가로로 눕혔을 때(화면 높이가 낮을 때): 떠 있는 버튼이 내용을 덜 가리게 조금 줄여요 */
  @media (max-height: 500px) {
    .전화버튼 { min-height: 48px; font-size: 16px; bottom: calc(8px + env(safe-area-inset-bottom)); }
    .화면 { padding-top: 20px; padding-bottom: 90px; }
    .머리 { padding: 24px 20px; }
  }
</style>
</head>
<body>
<div class="화면">

  <!-- ===== 1. 맨 위: 가게 이름과 소개 ===== -->
  <header class="머리 유리">
    <h1 id="가게이름"></h1>
    <p class="소개" id="가게소개"></p>
    <p class="위치" id="가게위치"></p>
  </header>

  <!-- ===== 2. 가운데: 메뉴 목록 ===== -->
  <div class="탭줄" id="탭줄"></div>
  <main id="메뉴목록"></main>

  <!-- ===== 3. 맨 아래: 영업시간과 전화 ===== -->
  <footer class="아래 유리">
    <h2>영업 안내</h2>
    <p id="평일시간"></p>
    <p id="주말시간"></p>
    <p id="휴무"></p>
    <p id="추가안내" style="margin-top:10px; opacity:0.85;"></p>
  </footer>

  <!-- 전화 걸기 버튼: 화면 아래에 떠 있어요. (영업 안내 카드 안에 넣으면 떠 있기가 깨져서 밖에 뒀어요) -->
  <a class="전화버튼" id="전화버튼">📞 전화 걸기</a>

</div>

<script>
  /* 가게 정보와 메뉴는 이 파일 맨 위쪽 "★★★ 사장님이 고치는 곳" 으로 옮겨 두었어요. */

  /* ============================================================
     아래부터는 화면을 그려주는 부분이에요. 몰라도 괜찮아요. (건드리지 마세요)
     ============================================================ */

  document.getElementById("가게이름").textContent = 가게.이름;
  document.getElementById("가게소개").textContent = 가게.소개;
  document.getElementById("가게위치").textContent = "📍 " + 가게.위치;
  document.getElementById("평일시간").textContent = 가게.평일;
  document.getElementById("주말시간").textContent = 가게.주말;
  document.getElementById("휴무").textContent = 가게.휴무;
  document.getElementById("추가안내").textContent = 가게.추가안내;
  document.getElementById("전화버튼").href = "tel:" + 가게.전화.replace(/[^0-9]/g, "");
  document.title = 가게.이름 + " 메뉴판";

  var 탭줄 = document.getElementById("탭줄");
  var 목록 = document.getElementById("메뉴목록");
  var 분류들 = Object.keys(메뉴);

  function 보여주기(분류) {
    Array.prototype.forEach.call(탭줄.children, function (버튼) {
      버튼.classList.toggle("선택됨", 버튼.textContent === 분류);
    });
    목록.innerHTML = "";
    // 이미 아래로 내려와 있었다면, 새 목록의 맨 위가 보이게 올려줘요
    var 머리 = document.querySelector(".머리");
    var 목표 = 머리.offsetTop + 머리.offsetHeight + 28;
    if (window.scrollY > 목표) window.scrollTo({ top: 목표, behavior: "smooth" });
    메뉴[분류].forEach(function (항목) {
      var 카드 = document.createElement("div");
      카드.className = "메뉴카드 유리";
      var 시그니처인가 = 시그니처메뉴.indexOf(항목.이름) >= 0;
      var 품절인가 = 항목.품절 === 1;
      if (시그니처인가) 카드.classList.add("시그니처");
      if (품절인가) 카드.classList.add("품절");
      var 표시 = (시그니처인가 ? '<span class="시그니처표시"></span>' : "") +
                 (품절인가 ? '<span class="품절표시">오늘 품절</span>' : "");
      카드.innerHTML =
        '<div class="메뉴윗줄"><span class="메뉴이름"></span><span class="메뉴가격"></span></div>' +
        '<p class="메뉴설명"></p>';
      카드.querySelector(".메뉴이름").textContent = 항목.이름;
      카드.querySelector(".메뉴이름").insertAdjacentHTML("beforeend", 표시);
      if (시그니처인가) 카드.querySelector(".시그니처표시").textContent = 시그니처글자;
      카드.querySelector(".메뉴가격").textContent = 항목.가격;
      카드.querySelector(".메뉴설명").textContent = 항목.설명;
      목록.appendChild(카드);
    });
  }

  분류들.forEach(function (분류) {
    var 버튼 = document.createElement("button");
    버튼.className = "탭";
    버튼.textContent = 분류;
    버튼.onclick = function () { 보여주기(분류); };
    탭줄.appendChild(버튼);
  });

  보여주기(분류들[0]);
</script>
</body>
</html>
